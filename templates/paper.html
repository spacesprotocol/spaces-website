{% extends "base.html" %}

{% block body_class %}no-page-grid{% endblock %}

{% block head %}
<meta name="author" content="M. Carson, Buffrr">
<meta name="citation_author" content="M. Carson">
<meta name="citation_author" content="Buffrr">
<meta name="citation_title" content="Spaces Protocol: Scalable &amp; Permissionless Bitcoin Identities">
<meta name="citation_publication_date" content="2024">
<meta name="citation_technical_report_institution" content="Impervious">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Anybody:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    /* ── Paper tokens mapped to site theme (works in both light + dark) ── */
    :root {
        --bp-deep: rgb(var(--color-base));
        --bp-base: rgb(var(--color-surface));
        --bp-mid: rgb(var(--color-raised-hover));
        --bp-line: rgb(var(--color-border));
        --bp-line-soft: rgb(var(--color-border) / 0.6);
        --bp-line-faint: rgb(var(--color-border-subtle));
        --bp-text: rgb(var(--color-txt-secondary));
        --bp-text-bright: rgb(var(--color-txt-primary));
        --bp-text-dim: rgb(var(--color-txt-muted));
        --bp-text-muted: rgb(var(--color-txt-muted));
        --bp-accent: rgb(var(--color-accent));
        --bp-accent-bright: rgb(var(--color-accent-strong));
        --bp-accent-glow: rgb(var(--color-accent) / 0.15);
        --bp-orange: rgb(var(--color-accent));
        --bp-orange-dim: rgb(var(--color-accent) / 0.16);
        --bp-grid-color: rgb(var(--color-border) / 0.45);
        --bp-grid-strong: rgb(var(--color-border) / 0.7);
    }

    /* Keep the paper's distinctive mono typography but inherit theme colors */
    body {
        font-family: 'IBM Plex Mono', monospace !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.7;
    }

    ::selection { background: rgb(var(--color-accent) / 0.25); color: rgb(var(--color-txt-primary)); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgb(var(--color-border)); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(var(--color-accent)); }

    /* ── Grid background ── */
    .blueprint-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
            linear-gradient(var(--bp-grid-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--bp-grid-color) 1px, transparent 1px),
            linear-gradient(var(--bp-grid-strong) 1px, transparent 1px),
            linear-gradient(90deg, var(--bp-grid-strong) 1px, transparent 1px);
        background-size:
            24px 24px,
            24px 24px,
            120px 120px,
            120px 120px;
        background-position: -1px -1px;
    }
    .blueprint-bg::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 0%, transparent 40%, var(--bp-deep) 80%);
    }

    /* ── Main container ── */
    .paper-wrap {
        position: relative;
        z-index: 1;
        max-width: 888px;
        margin: 0 auto;
        padding: 100px 2rem 80px;
    }

    /* ── Blueprint border frame ── */
    .paper-frame {
        border: 1px solid var(--bp-line-soft);
        border-radius: 2px;
        padding: 48px 52px 60px;
        position: relative;
        background: rgb(var(--color-surface) / 0.7);
        animation: fadeIn 0.6s ease forwards;
    }
    .paper-frame::before {
        content: '';
        position: absolute;
        inset: 6px;
        border: 1px solid var(--bp-line-faint);
        border-radius: 1px;
        pointer-events: none;
    }

    /* ── Corner marks ── */
    .corner-mark {
        position: absolute;
        width: 16px;
        height: 16px;
        pointer-events: none;
    }
    .corner-mark::before, .corner-mark::after {
        content: '';
        position: absolute;
        background: var(--bp-line);
    }
    .corner-mark--tl { top: -1px; left: -1px; }
    .corner-mark--tl::before { top: 0; left: 0; width: 16px; height: 1px; }
    .corner-mark--tl::after { top: 0; left: 0; width: 1px; height: 16px; }
    .corner-mark--tr { top: -1px; right: -1px; }
    .corner-mark--tr::before { top: 0; right: 0; width: 16px; height: 1px; }
    .corner-mark--tr::after { top: 0; right: 0; width: 1px; height: 16px; }
    .corner-mark--bl { bottom: -1px; left: -1px; }
    .corner-mark--bl::before { bottom: 0; left: 0; width: 16px; height: 1px; }
    .corner-mark--bl::after { bottom: 0; left: 0; width: 1px; height: 16px; }
    .corner-mark--br { bottom: -1px; right: -1px; }
    .corner-mark--br::before { bottom: 0; right: 0; width: 16px; height: 1px; }
    .corner-mark--br::after { bottom: 0; right: 0; width: 1px; height: 16px; }

    /* ── Header block ── */
    .rfc-header {
        display: flex;
        justify-content: space-between;
        padding-bottom: 24px;
        margin-bottom: 32px;
        border-bottom: 1px solid var(--bp-line-faint);
        font-size: 12px;
        line-height: 1.9;
        color: var(--bp-text-dim);
    }
    .rfc-header-right { text-align: right; }

    /* ── Typography ── */
    .paper-frame h1 {
        font-family: 'Anybody', sans-serif;
        font-weight: 800;
        font-size: 2rem;
        line-height: 1.25;
        color: var(--bp-text-bright);
        margin: 2.8em 0 0.8em;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        position: relative;
        padding-left: 20px;
    }
    .paper-frame h1::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0.15em;
        bottom: 0.15em;
        width: 3px;
        background: var(--bp-accent);
        border-radius: 1px;
    }
    .paper-frame h1:first-of-type { margin-top: 0; }

    .paper-frame h2 {
        font-family: 'Anybody', sans-serif;
        font-weight: 700;
        font-size: 1.25rem;
        line-height: 1.3;
        color: var(--bp-accent);
        margin: 2.2em 0 0.7em;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .paper-frame h3 {
        font-weight: 600;
        font-size: 1rem;
        color: var(--bp-text-bright);
        margin: 1.5em 0 0.5em;
    }

    .paper-frame p {
        margin: 1em 0;
        font-size: 14px;
        font-weight: 400;
        color: var(--bp-text);
    }

    .paper-frame strong { color: var(--bp-text-bright); font-weight: 600; }

    .paper-frame a {
        color: var(--bp-accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s, color 0.2s;
    }
    .paper-frame a:hover {
        color: var(--bp-accent-bright);
        border-bottom-color: var(--bp-accent-bright);
    }

    /* ── Blockquote / Note ── */
    .paper-frame blockquote {
        margin: 1.5em 0;
        padding: 14px 18px;
        border-left: 3px solid var(--bp-orange);
        background: var(--bp-orange-dim);
        border-radius: 0 3px 3px 0;
    }
    .paper-frame blockquote p {
        color: var(--bp-text);
        margin: 0;
        font-size: 14px;
    }

    /* ── Code ── */
    .paper-frame code:not(pre code) {
        background: rgb(var(--color-accent) / 0.08);
        border: 1px solid rgb(var(--color-accent) / 0.18);
        border-radius: 3px;
        padding: 1px 5px;
        font-size: 0.85em;
        color: rgb(var(--color-accent));
    }

    .paper-frame pre {
        margin: 1.5em 0 2em;
        padding: 20px 24px;
        background: rgb(var(--color-raised-hover));
        border: 1px solid var(--bp-line-soft);
        border-radius: 3px;
        overflow-x: auto;
        font-size: 14px;
        line-height: 1.6;
        color: var(--bp-text-bright);
    }
    .paper-frame pre code { background: none; border: none; padding: 0; color: inherit; font-size: inherit; }

    /* ── Lists ── */
    .paper-frame ul, .paper-frame ol {
        margin: 1em 0;
        padding-left: 1.8em;
        font-size: 14px;
    }
    .paper-frame li { margin: 0.35em 0; }
    .paper-frame li::marker { color: var(--bp-text-muted); }

    /* ── TOC ── */
    .rfc-toc {
        margin: 1em 0 1.5em;
        padding-left: 0;
        list-style: none;
    }
    .rfc-toc li {
        margin: 2px 0;
        font-size: 14px;
    }
    .rfc-toc a {
        color: var(--bp-text-dim);
        border-bottom: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: color 0.15s, padding-left 0.15s;
    }
    .rfc-toc a:hover {
        color: var(--bp-accent);
        padding-left: 4px;
    }
    .rfc-toc a::before {
        content: '\203A';
        color: var(--bp-line);
        font-weight: 300;
        transition: color 0.15s;
    }
    .rfc-toc a:hover::before { color: var(--bp-accent); }

    /* ── Figures ── */
    .rfc-fig {
        margin: 2.5em 0;
        text-align: center;
    }
    .rfc-fig img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 0 auto 12px;
        border: 1px solid var(--bp-line-faint);
        border-radius: 3px;
        padding: 12px;
        background: rgb(var(--color-surface));
    }
    /* The original figure artwork is dark-line on light; invert it for dark mode legibility */
    .dark .rfc-fig img {
        background: rgb(var(--color-raised));
        filter: invert(1) hue-rotate(180deg) brightness(0.92) saturate(0.85);
    }

    /* ── Inline figure SVGs use baked-in blueprint colors. Remap them to theme tokens. ── */
    .paper-frame svg [fill="#1e4a7a"]   { fill: rgb(var(--color-border)); }
    .paper-frame svg [stroke="#1e4a7a"] { stroke: rgb(var(--color-border)); }
    /* When #1e4a7a is used on a text element (dim hex preview labels), use a readable muted instead of the hairline-border color */
    .paper-frame svg text[fill="#1e4a7a"] { fill: rgb(var(--color-txt-muted)); }
    .paper-frame svg [fill="#3d6494"]   { fill: rgb(var(--color-txt-muted)); }
    .paper-frame svg [stroke="#3d6494"] { stroke: rgb(var(--color-txt-muted)); }
    .paper-frame svg [fill="#4da8da"]   { fill: rgb(var(--color-accent)); }
    .paper-frame svg [stroke="#4da8da"] { stroke: rgb(var(--color-accent)); }
    .paper-frame svg [fill="#6b8bb5"]   { fill: rgb(var(--color-txt-muted)); }
    .paper-frame svg [fill="#7ec8f0"]   { fill: rgb(var(--color-accent-strong)); }
    .paper-frame svg [stroke="#7ec8f0"] { stroke: rgb(var(--color-accent-strong)); }
    .paper-frame svg [fill="#c8ddf5"]   { fill: rgb(var(--color-txt-primary)); }
    .paper-frame svg [fill="#e8f0fb"]   { fill: rgb(var(--color-txt-primary)); }
    .paper-frame svg [stroke="#e8f0fb"] { stroke: rgb(var(--color-txt-primary)); }
    /* Neutral panel backgrounds: transparent in light (hairline border outlines define the panel), subtle raised tile in dark */
    .paper-frame svg [fill="rgba(13,31,60,0.4)"],
    .paper-frame svg [fill="rgba(13,31,60,0.5)"],
    .paper-frame svg [fill="rgba(13,31,60,0.6)"],
    .paper-frame svg [fill="rgba(13,31,60,0.7)"],
    .paper-frame svg [fill="rgba(13,31,60,0.85)"] { fill: transparent; }
    .dark .paper-frame svg [fill="rgba(13,31,60,0.4)"]   { fill: rgb(var(--color-raised-hover) / 0.5); }
    .dark .paper-frame svg [fill="rgba(13,31,60,0.5)"]   { fill: rgb(var(--color-raised-hover) / 0.6); }
    .dark .paper-frame svg [fill="rgba(13,31,60,0.6)"]   { fill: rgb(var(--color-raised-hover) / 0.7); }
    .dark .paper-frame svg [fill="rgba(13,31,60,0.7)"]   { fill: rgb(var(--color-raised-hover) / 0.8); }
    .dark .paper-frame svg [fill="rgba(13,31,60,0.85)"]  { fill: rgb(var(--color-raised-hover) / 0.95); }
    /* Translucent accent washes (originally light blue) → translucent site accent */
    .paper-frame svg [fill="rgba(77,168,218,0.05)"]  { fill: rgb(var(--color-accent) / 0.05); }
    .paper-frame svg [fill="rgba(77,168,218,0.06)"]  { fill: rgb(var(--color-accent) / 0.06); }
    .paper-frame svg [fill="rgba(77,168,218,0.08)"]  { fill: rgb(var(--color-accent) / 0.08); }
    .paper-frame svg [fill="rgba(77,168,218,0.1)"]   { fill: rgb(var(--color-accent) / 0.1); }
    .paper-frame svg [fill="rgba(77,168,218,0.12)"]  { fill: rgb(var(--color-accent) / 0.12); }
    .paper-frame svg [fill="rgba(126,200,240,0.04)"] { fill: rgb(var(--color-accent) / 0.04); }
    .paper-frame svg [fill="rgba(126,200,240,0.06)"] { fill: rgb(var(--color-accent) / 0.06); }
    .paper-frame svg [fill="rgba(126,200,240,0.08)"] { fill: rgb(var(--color-accent) / 0.08); }
    .rfc-fig svg {
        display: block;
        margin: 0 auto;
    }
    .rfc-fig figcaption {
        font-size: 11px;
        color: var(--bp-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-top: 8px;
    }

    /* ── Horizontal rules (section dividers) ── */
    .paper-frame hr {
        border: none;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--bp-line-soft) 20%, var(--bp-line-soft) 80%, transparent);
        margin: 3em 0;
    }

    /* ── References ── */
    .rfc-refs {
        padding-left: 1.5em;
        font-size: 12px;
    }
    .rfc-refs li {
        margin: 0.6em 0;
        color: var(--bp-text-dim);
    }
    .rfc-refs a { word-break: break-all; }

    /* ── Section numbering tick marks ── */
    .section-tick {
        display: inline-block;
        width: 8px;
        height: 1px;
        background: var(--bp-accent);
        margin-right: 8px;
        vertical-align: middle;
    }

    /* ── Drawing reference stamp ── */
    .dwg-stamp {
        margin-top: 3em;
        padding-top: 1.5em;
        border-top: 1px solid var(--bp-line-faint);
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--bp-text-muted);
    }
    .dwg-stamp > div {
        padding: 8px 12px;
        border: 1px solid var(--bp-line-faint);
        margin: -0.5px;
    }
    .dwg-stamp .label { font-size: 8px; color: var(--bp-line); margin-bottom: 2px; }

    /* ── Animations ── */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
        .paper-frame { padding: 28px 20px 36px; }
        .paper-frame h1 { font-size: 1.5rem; }
        .paper-frame h2 { font-size: 1.1rem; }
        .rfc-header { flex-direction: column; gap: 8px; }
        .rfc-header-right { text-align: left; }
        .dwg-stamp { grid-template-columns: 1fr 1fr; }
    }
</style>
{% endblock %}

{% block content %}
<div class="blueprint-bg"></div>

<div class="paper-wrap">
    <div class="paper-frame">
        <div class="corner-mark corner-mark--tl"></div>
        <div class="corner-mark corner-mark--tr"></div>
        <div class="corner-mark corner-mark--bl"></div>
        <div class="corner-mark corner-mark--br"></div>

        {{ section.content | safe }}
    </div>
</div>
{% endblock %}
