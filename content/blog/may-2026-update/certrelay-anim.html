<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certrelay network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: {
                base:'#0e0e11', surface:'#151519', raised:'#1c1c22',
                border:'#2a2a31', 'border-subtle':'#1f1f26',
                accent:'#e0722e',
                'txt-primary':'#dcdce0', 'txt-secondary':'#8a8a94', 'txt-muted':'#585862',
                'sp-green':'#3fbc8b', 'sp-blue':'#5e9de0', 'sp-blue-dim':'rgba(94,157,224,0.10)',
            }, fontFamily: { sans:['"DM Sans"','sans-serif'], mono:['"JetBrains Mono"','monospace'] } } }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { background:#0e0e11; margin:0; height:100%; }
        body {
            font-family:'DM Sans',sans-serif;
            color:#dcdce0;
            display:flex; align-items:center; justify-content:center;
            padding:20px;
        }
        .stat-num { font-variant-numeric: tabular-nums; }
        .dot-grid {
            background-image: radial-gradient(circle, #2a2a31 0.6px, transparent 0.6px);
            background-size: 28px 28px;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
        @keyframes dhtOrbit { to{transform:rotate(360deg)} }
        @keyframes dhtRingPulse { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.02)} }
        @keyframes relayPacketRight { 0%{transform:translateX(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateX(52px);opacity:0} }
        .stage { width:100%; max-width:540px; }
    </style>
</head>
<body>

<div class="stage">
    <div class="flex items-center justify-start gap-2 mb-2 px-1">
        <span class="relative flex h-[5px] w-[5px]">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sp-blue opacity-75"></span>
            <span class="relative inline-flex rounded-full h-[5px] w-[5px] bg-sp-blue shadow-[0_0_5px_#5e9de0]"></span>
        </span>
        <span class="font-mono text-[10px] text-txt-muted">Peers:</span>
        <span class="font-mono text-[11px] font-bold text-sp-blue stat-num" id="peerCount">0</span>
    </div>

    <div class="relative overflow-hidden rounded-[10px]" style="height:360px" id="networkViz">
        <div class="absolute inset-0 dot-grid opacity-15 pointer-events-none"></div>

        <div class="absolute left-4 top-1/2 -translate-y-1/2 w-[100px] z-10">
            <div class="bg-surface border border-accent/25 rounded-lg p-2.5 text-center">
                <div class="font-mono text-[8px] font-semibold text-txt-muted uppercase tracking-[0.06em] mb-1">User</div>
                <div class="font-mono text-[11px] font-bold text-accent mb-1">alice@btc</div>
                <div class="font-mono text-[7px] text-txt-muted">publish records</div>
            </div>
        </div>

        <svg class="absolute left-[108px] top-1/2 -translate-y-[1px] w-[60px] h-[2px] z-[5]" viewBox="0 0 60 2" preserveAspectRatio="none">
            <line x1="0" y1="1" x2="60" y2="1" stroke="#e0722e" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="4 3">
                <animate attributeName="stroke-dashoffset" values="7;0" dur=".8s" repeatCount="indefinite"/>
            </line>
        </svg>
        <div class="absolute left-[108px] top-1/2 -translate-y-1/2 z-[6]">
            <div class="w-2 h-2 rounded-full bg-accent shadow-[0_0_6px_#e0722e]" style="animation:relayPacketRight 1.6s ease-in-out infinite"></div>
        </div>

        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[160px] h-[160px] z-[3]">
            <div class="absolute inset-0 rounded-full border border-sp-blue/10" style="animation:dhtRingPulse 4s ease-in-out infinite"></div>
            <div class="absolute inset-3 rounded-full border border-sp-blue/8" style="animation:dhtRingPulse 4s ease-in-out infinite .5s"></div>
            <div class="absolute inset-0 rounded-full bg-sp-blue/[0.03] blur-sm"></div>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
                <div class="font-mono text-[9px] font-semibold text-sp-blue uppercase tracking-[0.08em] mb-1">Certrelay</div>
                <div class="font-mono text-[7px] text-txt-muted">peer-to-peer relay</div>
            </div>
            <div class="absolute inset-[-8px]" style="animation:dhtOrbit 12s linear infinite">
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-raised border border-sp-blue/30 flex items-center justify-center">
                    <div class="w-1.5 h-1.5 rounded-full bg-sp-blue/60" style="animation:pulse-dot 2s ease infinite"></div>
                </div>
            </div>
            <div class="absolute inset-[-12px]" style="animation:dhtOrbit 18s linear infinite reverse">
                <div class="absolute bottom-0 right-[15%] w-2.5 h-2.5 rounded-full bg-raised border border-sp-blue/25 flex items-center justify-center">
                    <div class="w-1 h-1 rounded-full bg-sp-blue/50" style="animation:pulse-dot 2.5s ease infinite .3s"></div>
                </div>
            </div>
            <div class="absolute inset-[-4px]" style="animation:dhtOrbit 15s linear infinite">
                <div class="absolute top-[20%] right-0 w-2 h-2 rounded-full bg-raised border border-sp-blue/20 flex items-center justify-center">
                    <div class="w-1 h-1 rounded-full bg-sp-blue/40" style="animation:pulse-dot 3s ease infinite .8s"></div>
                </div>
            </div>
            <div class="absolute inset-[-16px]" style="animation:dhtOrbit 22s linear infinite reverse">
                <div class="absolute top-[35%] left-0 w-2 h-2 rounded-full bg-raised border border-sp-blue/15">
                    <div class="absolute inset-[3px] rounded-full bg-sp-blue/30" style="animation:pulse-dot 2.8s ease infinite 1.2s"></div>
                </div>
            </div>
            <div class="absolute inset-[-6px]" style="animation:dhtOrbit 20s linear infinite">
                <div class="absolute bottom-[10%] left-[20%] w-2.5 h-2.5 rounded-full bg-raised border border-sp-blue/20">
                    <div class="absolute inset-[3px] rounded-full bg-sp-blue/40" style="animation:pulse-dot 2.2s ease infinite .5s"></div>
                </div>
            </div>
        </div>

        <svg class="absolute right-[108px] top-1/2 -translate-y-[1px] w-[60px] h-[2px] z-[5]" viewBox="0 0 60 2" preserveAspectRatio="none">
            <line x1="0" y1="1" x2="60" y2="1" stroke="#3fbc8b" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="4 3">
                <animate attributeName="stroke-dashoffset" values="7;0" dur=".8s" repeatCount="indefinite"/>
            </line>
        </svg>
        <div class="absolute right-[108px] top-1/2 -translate-y-1/2 z-[6]">
            <div class="w-2 h-2 rounded-full bg-sp-green shadow-[0_0_6px_#3fbc8b]" style="animation:relayPacketRight 1.6s ease-in-out infinite .5s"></div>
        </div>

        <div class="absolute right-4 top-1/2 -translate-y-1/2 w-[100px] z-10">
            <div class="bg-surface border border-sp-green/25 rounded-lg p-2.5 text-center">
                <div class="font-mono text-[8px] font-semibold text-txt-muted uppercase tracking-[0.06em] mb-1">App</div>
                <div class="font-mono text-[10px] font-semibold text-sp-green mb-1">resolve()</div>
                <div class="font-mono text-[7px] text-txt-muted">verify proof</div>
            </div>
        </div>

        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center gap-2">
            <div class="px-3 py-1.5 rounded-md bg-sp-blue/[0.06] border border-sp-blue/15">
                <span class="font-mono text-[10px] text-sp-blue font-medium">zero on-chain bytes</span>
            </div>
            <span class="font-mono text-[8px] text-txt-muted">verified against Bitcoin state root</span>
        </div>
    </div>

    <div class="mt-3 px-1">
        <div class="flex items-center gap-2 mb-2">
            <span class="font-mono text-[9px] font-semibold uppercase tracking-[0.06em] text-txt-muted">Resolution Log</span>
        </div>
        <div class="space-y-1" id="resLog">
            <div class="flex items-center gap-2 font-mono text-[10px]">
                <span class="text-txt-muted">&rarr;</span>
                <span class="text-sp-blue">resolve</span>
                <span class="text-txt-muted">(</span><span class="text-accent">"alice@bitcoin"</span><span class="text-txt-muted">)</span>
                <span class="text-sp-green ml-auto">&check; verified</span>
            </div>
        </div>
    </div>
</div>

<script>
    let peerVal = 0;
    const peerEl = document.getElementById('peerCount');
    const resLogEl = document.getElementById('resLog');
    const relayNames = ['alice@bitcoin','bob@nostr','satoshi@lightning','eve@taproot','hal@signet','ada@ordinals'];
    function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
    function animatePeers(){
        const target = 12 + Math.floor(Math.random()*8);
        const step = () => { if(peerVal < target){ peerVal++; if(peerEl) peerEl.textContent = peerVal; setTimeout(step, 80+Math.random()*120); } };
        step();
    }
    setTimeout(animatePeers, 800);
    function addRes(){
        if(!resLogEl) return;
        const name = pick(relayNames);
        const e = document.createElement('div');
        e.className = 'flex items-center gap-2 font-mono text-[10px]';
        e.style.opacity = '0'; e.style.transition = 'opacity .3s ease';
        e.innerHTML = `<span class="text-txt-muted">→</span><span class="text-sp-blue">resolve</span><span class="text-txt-muted">(</span><span class="text-accent">"${name}"</span><span class="text-txt-muted">)</span><span class="text-sp-green ml-auto">✓ verified</span>`;
        resLogEl.prepend(e);
        requestAnimationFrame(() => e.style.opacity = '1');
        while(resLogEl.children.length > 4) resLogEl.lastChild.remove();
    }
    setInterval(addRes, 3000); setTimeout(addRes, 1500);
    setInterval(() => { peerVal += Math.random() > .5 ? 1 : -1; peerVal = Math.max(8, Math.min(24, peerVal)); if(peerEl) peerEl.textContent = peerVal; }, 5000);
</script>
</body>
</html>
