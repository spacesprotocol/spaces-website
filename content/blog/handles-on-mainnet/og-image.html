<!doctype html>
<!-- Source for og-image.png. Render at 1200x630:
     chrome --headless=new --screenshot=og-image.png --window-size=1200,630 og-image.html -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Lilex:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        background: #0e0e11;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    /* grid */
    .grid {
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
        background-size: 60px 60px;
    }
    /* accent wash, keeps the plate from reading flat once the art is gone */
    .wash {
        position: absolute; right: -180px; top: -220px; width: 900px; height: 900px;
        background: radial-gradient(circle, rgba(224,114,46,.16) 0%, rgba(224,114,46,.05) 40%, transparent 66%);
    }
    .wash-2 {
        position: absolute; left: -260px; bottom: -340px; width: 820px; height: 820px;
        background: radial-gradient(circle, rgba(224,114,46,.10) 0%, transparent 62%);
    }

    .col { position: absolute; left: 92px; right: 92px; top: 150px; }
    .eyebrow {
        font-family: 'Lilex', monospace; font-weight: 600; font-size: 20px;
        letter-spacing: .17em; color: #e0722e; text-transform: uppercase; margin-bottom: 30px;
    }
    h1 {
        font-size: 96px; font-weight: 700; letter-spacing: -.028em; line-height: 1;
        color: #f4f4f6; margin-bottom: 32px;
    }
    p { font-size: 32px; line-height: 1.42; color: #a3a3ad; max-width: 960px; font-weight: 400; }
    /* footer */
    .foot { position: absolute; left: 92px; bottom: 50px; display: flex; align-items: center; gap: 12px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #e0722e; }
    .brand { font-size: 24px; font-weight: 500; color: #e8e8ea; }
    .url {
        position: absolute; right: 92px; bottom: 56px;
        font-family: 'Lilex', monospace; font-size: 16px; letter-spacing: .1em; color: #63636d;
    }
</style>
</head>
<body>
    <div class="grid"></div>
    <div class="wash"></div>
    <div class="wash-2"></div>

    <div class="col">
        <div class="eyebrow">Spaces Protocol &nbsp;·&nbsp; Release</div>
        <h1>Handles on Mainnet!</h1>
        <p>Sovereign, irrevocable, permanent. Spaces v0.4.2 ships off-chain issuance to mainnet, with @bitcoin as the first operator.</p>
    </div>

    <div class="foot">
        <div class="dot"></div>
        <div class="brand">Spaces Protocol</div>
    </div>
    <div class="url">SPACESPROTOCOL.ORG</div>
</body>
</html>
